[project]
name = "fpgatools"
# The package version is meaningless: everything this repo produces is
# versioned from git (see fpgatools/version.py and README "Versioning").
version = "0"
description = "Patch-series, version and packaging tooling for the fpgas.online openFPGALoader/OpenOCD builds"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fpgatools = "fpgatools.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fpgatools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
