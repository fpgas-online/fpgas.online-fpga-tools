name: Static binaries + GitHub Release

# Static (musl) builds of both tools on both tracks for arm64, armv7 and
# armv6, built in Alpine containers on an arm64 runner (the 32-bit ones under
# the runner's binfmt emulation). On main the results are uploaded to the
# rolling release of the current vX.Y series with versioned filenames, plus
# a latest.json index; pull requests only build.
#
# The builds are build-static.yml, which daily.yml also calls for candidate
# pins; only this workflow uploads.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to build; uploading is disabled when set"
        type: string
        default: ""

permissions:
  contents: read

# A newer push to a pull request cancels that PR's older run. Every other
# run (main, dispatches) gets a group of its own: a shared group would drop
# a queued publish, which pending-run replacement does even without
# cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build-static.yml
    with:
      ref: ${{ inputs.ref }}

  release:
    name: upload to the series release
    if: inputs.ref == '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the series prerelease and upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      # One directory per build job (no merge-multiple): builds that claim
      # the same asset name must not silently overwrite each other on disk;
      # release.py refuses to upload them instead.
      - uses: actions/download-artifact@v4
        with:
          pattern: static-*
          path: assets/
      - name: Upload versioned assets and refresh latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python packaging/release.py --assets assets
      # The same tarballs on this build's own release, next to debs.yml's
      # Debian packages, so each build is complete in one place.
      - name: Upload to the build's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python packaging/release.py --assets assets --build-release
