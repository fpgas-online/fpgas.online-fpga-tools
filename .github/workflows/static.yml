name: Static binaries + GitHub Release

# Static (musl) builds of both tools on both tracks for arm64, armv7 and
# armv6, built in Alpine containers on an arm64 runner (the 32-bit ones under
# the runner's binfmt emulation). On main the results are uploaded to the
# rolling release of the current vX.Y series with versioned filenames, plus
# a latest.json index; pull requests only build.
#
# daily.yml calls this workflow to build candidate upstream pins before they
# reach main; such a call passes `ref` and must never upload to the release.
# A called workflow sees the CALLER's github.event_name and github.ref, so
# the release gate keys on `ref` being empty, not on the event.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to build (default: this workflow's own ref)"
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Commit or branch to build; uploading is disabled when set"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.tool }}/${{ matrix.track }} static ${{ matrix.arch }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        tool: [openfpgaloader, openocd]
        track: [stable, master]
        arch: [arm64, armv7, armv6]
        include:
          - arch: arm64
            image: alpine:3.21
            platform: linux/arm64
          - arch: armv7
            image: arm32v7/alpine:3.21
            platform: linux/arm/v7
          - arch: armv6
            image: arm32v6/alpine:3.21
            platform: linux/arm/v6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # fpgatools version needs the series tags
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --quiet

      - name: Fetch pinned upstreams and apply the series
        run: |
          uv run fpgatools fetch piolib
          uv run fpgatools fetch rp1jtag
          uv run fpgatools apply ${{ matrix.tool }} ${{ matrix.track }}

      - name: Versions
        id: ver
        run: |
          echo "version=$(uv run fpgatools version ${{ matrix.tool }} ${{ matrix.track }})" >> "$GITHUB_OUTPUT"
          echo "local=$(uv run fpgatools version ${{ matrix.tool }} ${{ matrix.track }} --tool-string)" >> "$GITHUB_OUTPUT"

      - name: Build in ${{ matrix.image }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          LOCAL: ${{ steps.ver.outputs.local }}
        run: |
          # NOTE: not `container: alpine`: JavaScript actions do not run in
          # Alpine on the arm runners, so the build is a plain docker run.
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "$GITHUB_WORKSPACE:/work" -w /work -e REPO=/work \
            "${{ matrix.image }}" \
            sh -ec "packaging/static/${{ matrix.tool }}.sh ${{ matrix.track }} '$VERSION' '$LOCAL'"

      - uses: actions/upload-artifact@v4
        with:
          name: static-${{ matrix.tool }}-${{ matrix.track }}-${{ matrix.arch }}
          path: built-static/*
          if-no-files-found: error

  release:
    name: upload to the series release
    if: inputs.ref == '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the series prerelease and upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      # One directory per build job (no merge-multiple): builds that claim
      # the same asset name must not silently overwrite each other on disk;
      # release.py refuses to upload them instead.
      - uses: actions/download-artifact@v4
        with:
          pattern: static-*
          path: assets/
      - name: Upload versioned assets and refresh latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python packaging/release.py --assets assets
      # The same tarballs on this build's own release, next to debs.yml's
      # Debian packages, so each build is complete in one place.
      - name: Upload to the build's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python packaging/release.py --assets assets --build-release
