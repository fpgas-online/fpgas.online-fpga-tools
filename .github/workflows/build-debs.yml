name: Build Debian packages

# The deb build matrix, called by debs.yml (which then publishes) and by
# daily.yml (which builds candidate pins and must never publish). It holds
# only a read token, and asks for nothing more: a called workflow cannot be
# granted more than its caller holds, and GitHub rejects the whole run at
# startup, before any `if:` is evaluated, if it asks. The build jobs run
# Docker and compile third-party sources and must never hold a token that
# can write.
#
# The artifacts it uploads belong to the calling run, where debs.yml's
# release and publish jobs collect them.
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit or branch to build (default: the caller's own ref)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # The shared libraries, once per suite and architecture: every tool build
  # of that suite/arch builds against these exact packages, and they are
  # published once.
  libs:
    name: libs (${{ matrix.suite }} ${{ matrix.arch }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie, sid]
        arch: [arm64, armhf]
        include:
          - arch: arm64
            platform: linux/arm64
          - arch: armhf
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # fpgatools version needs the series tags

      - name: Build in debian:${{ matrix.suite }} for ${{ matrix.arch }}
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "$GITHUB_WORKSPACE:/work" -w /work -e REPO=/work -e SUITE=${{ matrix.suite }} \
            "debian:${{ matrix.suite }}" \
            sh -ec 'packaging/build-libs.sh'

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.suite }}-${{ matrix.arch }}-libs
          path: built-libs/*.deb
          if-no-files-found: error

  build:
    name: ${{ matrix.tool }}/${{ matrix.track }} (${{ matrix.suite }} ${{ matrix.arch }})
    needs: libs
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        tool: [openfpgaloader, openocd]
        track: [stable, master]
        suite: [bookworm, trixie, sid]
        arch: [arm64, armhf]
        include:
          - arch: arm64
            platform: linux/arm64
          - arch: armhf
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # fpgatools version needs the series tags

      - uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.suite }}-${{ matrix.arch }}-libs
          path: built-libs

      - name: Build in debian:${{ matrix.suite }} for ${{ matrix.arch }}
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "$GITHUB_WORKSPACE:/work" -w /work -e REPO=/work -e SUITE=${{ matrix.suite }} \
            -e LIBS_DIR=/work/built-libs \
            "debian:${{ matrix.suite }}" \
            sh -ec 'packaging/build-deb.sh ${{ matrix.tool }} ${{ matrix.track }}'

      # Debug symbols over 10 MB stay out of the apt repository (see the top
      # of debs.yml); its release job still publishes them. built-debs/ is
      # root's (the build ran in a container), hence sudo.
      - name: Set aside debug symbols too large for the apt repository
        run: |
          set -eu
          mkdir -p built-dbgsym
          for f in built-debs/*-dbgsym_*.deb; do
            [ -e "$f" ] || continue
            if [ "$(stat -c %s "$f")" -gt 10000000 ]; then
              sudo mv -v "$f" built-dbgsym/
            fi
          done

      # publish-apt takes the suite from the longest configured suite the name
      # starts with after "debs-"; anything after "debs-<suite>-<arch>" only
      # keeps the artifact names distinct.
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.suite }}-${{ matrix.arch }}-${{ matrix.tool }}-${{ matrix.track }}
          path: built-debs/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: dbgsym-${{ matrix.suite }}-${{ matrix.arch }}-${{ matrix.tool }}-${{ matrix.track }}
          path: built-dbgsym/*.deb
          if-no-files-found: ignore
