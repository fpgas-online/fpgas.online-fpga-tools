name: Debian packages + apt repository

# Every push to main builds openfpgaloader-fpgasonline[-git] and
# openocd-fpgasonline[-git] for each supported suite and architecture,
# together with the shared librp1jtag0 (and, where Raspberry Pi's archive has
# none, libpio0) they depend on, then publishes one signed flat apt
# repository per suite to this repository's GitHub Pages through
# mithro/apt-repo-action:
#
#   deb [signed-by=/etc/apt/keyrings/fpgas.online-fpga-tools.gpg] \
#       https://fpgas.online/fpgas.online-fpga-tools/<suite>/ ./
#
# -dbgsym packages over 10 MB (openFPGALoader's, ~20 MB each; they were 79% of
# the repository) go to the series' GitHub Release instead, as
# <suite>_<file>.deb, so the Pages site has room to keep earlier versions.
#
# Pull requests build everything and publish nothing.
#
# arm64 and armhf only: the point of these builds is the Raspberry Pi fleet
# (the RP1 PIO driver has nothing to drive elsewhere). bookworm is built as
# well as trixie/sid because the fpgas.online Pi NFS root is still bookworm.
#
# daily.yml calls this workflow to build candidate upstream pins before they
# reach main; such a call passes `ref` and must never publish. Note that a
# called workflow sees the CALLER's github.event_name and github.ref, so the
# publish gate keys on `ref` being empty, not on the event.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to build (default: this workflow's own ref)"
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Commit or branch to build; publishing is disabled when set"
        type: string
        required: true

# A reusable workflow cannot escalate beyond its caller's permissions, so the
# Pages scopes are granted on the publish job alone; the build jobs run Docker
# and compile third-party sources and must never hold a token that can write.
permissions:
  contents: read

jobs:
  # The shared libraries, once per suite and architecture: every tool build
  # of that suite/arch builds against these exact packages, and they are
  # published once.
  libs:
    name: libs (${{ matrix.suite }} ${{ matrix.arch }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie, sid]
        arch: [arm64, armhf]
        include:
          - arch: arm64
            platform: linux/arm64
          - arch: armhf
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # fpgatools version needs the series tags

      - name: Build in debian:${{ matrix.suite }} for ${{ matrix.arch }}
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "$GITHUB_WORKSPACE:/work" -w /work -e REPO=/work -e SUITE=${{ matrix.suite }} \
            "debian:${{ matrix.suite }}" \
            sh -ec 'packaging/build-libs.sh'

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.suite }}-${{ matrix.arch }}-libs
          path: built-libs/*.deb
          if-no-files-found: error

  build:
    name: ${{ matrix.tool }}/${{ matrix.track }} (${{ matrix.suite }} ${{ matrix.arch }})
    needs: libs
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        tool: [openfpgaloader, openocd]
        track: [stable, master]
        suite: [bookworm, trixie, sid]
        arch: [arm64, armhf]
        include:
          - arch: arm64
            platform: linux/arm64
          - arch: armhf
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # fpgatools version needs the series tags

      - uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.suite }}-${{ matrix.arch }}-libs
          path: built-libs

      - name: Build in debian:${{ matrix.suite }} for ${{ matrix.arch }}
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "$GITHUB_WORKSPACE:/work" -w /work -e REPO=/work -e SUITE=${{ matrix.suite }} \
            -e LIBS_DIR=/work/built-libs \
            "debian:${{ matrix.suite }}" \
            sh -ec 'packaging/build-deb.sh ${{ matrix.tool }} ${{ matrix.track }}'

      # Debug symbols over 10 MB go to the GitHub Release, not the apt
      # repository (see the top of this file). Every suite's build names its
      # .deb the same, so the suite is prefixed. built-debs/ is root's (the
      # build ran in a container), hence sudo.
      - name: Set aside debug symbols too large for the apt repository
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -eu
          mkdir -p built-dbgsym
          for f in built-debs/*-dbgsym_*.deb; do
            [ -e "$f" ] || continue
            if [ "$(stat -c %s "$f")" -gt 10000000 ]; then
              sudo mv -v "$f" "built-dbgsym/${SUITE}_$(basename "$f")"
            fi
          done

      # The publish workflow files each artifact under the longest suite its
      # name starts with, so anything after "debs-<suite>-<arch>" only keeps
      # the artifact names distinct.
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.suite }}-${{ matrix.arch }}-${{ matrix.tool }}-${{ matrix.track }}
          path: built-debs/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: dbgsym-${{ matrix.suite }}-${{ matrix.arch }}-${{ matrix.tool }}-${{ matrix.track }}
          path: built-dbgsym/*.deb
          if-no-files-found: ignore

  release-dbgsym:
    name: large debug symbols to the series release
    if: inputs.ref == '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release.py finds the series tag with git describe
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: dbgsym-*
          path: dbgsym/
      # --no-index: latest.json is static.yml's, and runs concurrently.
      - name: Upload to the series release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python packaging/release.py --assets dbgsym --no-index

  publish:
    # Scoped to this job alone: a job calling a reusable workflow sets the
    # maximum permissions available to it.
    permissions:
      contents: read
      pages: write
      id-token: write
    if: inputs.ref == '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [libs, build]
    # Pinned by commit: this job hands the signing key to the called workflow.
    # main was ece43dd on 2026-09-24; bump deliberately.
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@ece43dd05997c5cc7f7852af084f319431147ca8
    with:
      suites: "bookworm trixie sid"
      architectures: "arm64 armhf"
      description: "fpgas.online builds of openFPGALoader and OpenOCD (RP1 PIO JTAG, NeTV2, Tiny Tapeout FPGA board, SPI flash info)"
      # Transitional: the key's old names, until every client has moved to
      # fpgas.online-fpga-tools.gpg (docs/conventions.md in mithro/apt-repo-action).
      # Earlier versions are kept up to the default size-limit-mb (900).
      legacy-paths: "fpgas-online-fpga-tools.gpg fpgas-online-fpga-tools.asc"
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
