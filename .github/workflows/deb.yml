name: Debian packages

# Every push to main builds openfpgaloader-fpgasonline[-git] and
# openocd-fpgasonline[-git] for each suite and architecture in
# .github/apt-packaging.toml, together with the shared librp1jtag0 (and,
# where Raspberry Pi's archive has none, libpio0) they depend on, then
# publishes one signed flat apt repository per suite to this repository's
# GitHub Pages through mithro/apt-repo-action's publish-apt.yml:
#
#   deb [signed-by=/etc/apt/keyrings/fpgas.online-fpga-tools.gpg] \
#       https://fpgas.online/fpgas.online-fpga-tools/<suite>/ ./
#
# Every package of a build, debug symbols included, is also on that build's
# own GitHub Release (build-<repo version>, with static.yml's binaries), as
# <suite>_<file>.deb; the apt repository is the easy way to install them. It
# leaves out -dbgsym packages over 10 MB (openFPGALoader's, ~20 MB each; they
# were 79% of it), so the Pages site has room to keep earlier versions.
#
# Pull requests build everything, versioned below main (~pr<P>), and publish
# nothing.
#
# arm64 and armhf only, and the Raspbian suites: the point of these builds is
# the Raspberry Pi fleet (the RP1 PIO driver has nothing to drive elsewhere).
# bookworm is built as well because the fpgas.online Pi NFS root and the
# NeTV2 hosts still run it.
#
# The builds are build-debs.yml, which daily.yml also calls for candidate
# pins; only this workflow publishes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to build; publishing is disabled when set"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deb-${{ github.ref }}
  # A newer push to a pull request cancels the older build. On the default
  # branch a running publish is never cancelled: the newest push waits for it,
  # and replaces any older push still waiting (it contains that one's commits).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The tooling, and every patch series applying to its pinned upstream with
  # both tracks in step.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # fpgatools version needs the series tags
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --quiet
      - run: uv run ruff check
      - run: uv run pytest -q
      - run: shellcheck packaging/*.sh packaging/static/*.sh
      - name: Version strings for this commit
        run: |
          for tool in openfpgaloader openocd; do
            for track in stable master; do
              echo "$tool/$track: $(uv run fpgatools version $tool $track)"
            done
          done
      - name: Fetch the pinned upstreams and apply the series
        run: |
          set -eu
          for tool in openfpgaloader openocd; do
            for track in stable master; do
              uv run fpgatools apply "$tool" "$track"
            done
            uv run fpgatools compare "$tool"
          done

  build-deb:
    needs: test
    uses: ./.github/workflows/build-debs.yml
    with:
      ref: ${{ inputs.ref }}

  release:
    name: release
    if: inputs.ref == '' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the build's release and upload assets
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the build's version comes from git describe
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --quiet
      # One directory per artifact: debs-* (what the apt repository gets,
      # the shared libraries included) and dbgsym-* (what it leaves out).
      - uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          pattern: dbgsym-*
          path: artifacts/
      # Every suite's build names its .deb the same; the artifact name says
      # which suite (the longest one it starts with, as in publish-apt).
      - name: Name each package by its suite
        env:
          SUITES: bookworm trixie forky sid raspbian-bookworm raspbian-trixie raspbian-forky
        run: |
          set -eu
          mkdir release
          for d in artifacts/*/; do
            name=$(basename "$d")
            rest=${name#*-}
            suite=""
            for s in $SUITES; do
              if [[ "$rest" == "$s-"* && ${#s} -gt ${#suite} ]]; then suite=$s; fi
            done
            if [ -z "$suite" ]; then
              echo "::error::artifact $name names no suite in '$SUITES'"
              exit 1
            fi
            for f in "$d"*.deb; do
              out="release/${suite}_$(basename "$f")"
              if [ -e "$out" ]; then
                echo "::error::two builds produced $out"
                exit 1
              fi
              cp "$f" "$out"
            done
          done
          ls -l release/
      - name: Upload to the build's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python packaging/release.py --assets release --build-release

  publish-apt:
    if: inputs.ref == '' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build-deb
    # Scoped to this job alone: a job calling a reusable workflow sets the
    # maximum permissions available to it. build-debs.yml never sees these.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "bookworm trixie forky sid raspbian-bookworm raspbian-trixie raspbian-forky"
      architectures: "arm64 armhf"
      description: "fpgas.online builds of openFPGALoader and OpenOCD (RP1 PIO JTAG, NeTV2, Tiny Tapeout FPGA board, SPI flash info)"
      # Earlier versions are kept up to the default size-limit-mb (900).
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
