# How this repository is packaged, and why it differs from the defaults.
# See https://github.com/mithro/apt-repo-action/blob/main/docs/packaging.md

kind = "B"                  # our own repository: patches and build scripts
variant = "patch-series"    # for openFPGALoader, OpenOCD, librp1jtag and
                            # PIOLib, fetched at the commits upstreams.toml pins
architectures = ["arm64", "armhf"]
suites = ["bookworm", "trixie", "forky", "sid",
          "raspbian-bookworm", "raspbian-trixie", "raspbian-forky"]

[exceptions]
PKG-ARCH = "hardware-specific: Raspberry Pi 5 (RP1 PIO JTAG)"
PKG-SUITES = "fpgas.online uses it; NeTV2"
PKG-NODATES = "libpio: Raspberry Pi's piolib has no tags or versions"
